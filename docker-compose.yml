version: '3.8'

services:
  # Edge Proxy & MCP Data Plane (agentgateway.dev)
  agentgateway:
    image: ghcr.io/agentgateway/agentgateway:latest
    container_name: superapp-agentgateway
    ports:
      - "127.0.0.1:${PORT_AGENTGATEWAY_EDGE:-8080}:8080"
    volumes:
      - ./services/agentgateway/config.yaml:/etc/agentgateway/config.yaml:ro
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    command: ["run", "--config", "/etc/agentgateway/config.yaml"]
    depends_on:
      - agent-core
      - service-ride
      - service-food
      - service-wallet
      - service-profile

  # Agent Core: A2-UI Protocol Broker & LangGraph Cognitive Engine
  agent-core:
    build:
      context: .
      dockerfile: services/agent-core/Dockerfile
    container_name: superapp-agent-core
    ports:
      - "127.0.0.1:${PORT_AGENT_CORE:-${PORT_GATEWAY:-4000}}:4000"
    environment:
      - PORT=4000
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openrouter/free}
      - AGENTGATEWAY_URL=http://agentgateway:8080
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_ISSUER=${KEYCLOAK_ISSUER:-http://localhost:8085/realms/superapp}
      - KEYCLOAK_AUDIENCE=${KEYCLOAK_AUDIENCE:-agent-core}
      - KEYCLOAK_JWKS_URL=http://keycloak:8080/realms/superapp/protocol/openid-connect/certs
      - DEMO_AUTH=${DEMO_AUTH:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:3002}
      - ENABLE_LIVE_LLM=${ENABLE_LIVE_LLM:-true}
      - OPENROUTER_ALLOW_PAID_MODELS=${OPENROUTER_ALLOW_PAID_MODELS:-false}
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - service-ride
      - service-food
      - service-wallet
      - service-catalog
      - service-profile

  # Domain Microservice: Ride & Mobility
  service-ride:
    build:
      context: .
      dockerfile: services/service-ride/Dockerfile
    container_name: superapp-service-ride
    ports:
      - "127.0.0.1:${PORT_SERVICE_RIDE:-4001}:4001"
    environment:
      - PORT=4001

  # Domain Microservice: Food & Dining
  service-food:
    build:
      context: .
      dockerfile: services/service-food/Dockerfile
    container_name: superapp-service-food
    ports:
      - "127.0.0.1:${PORT_SERVICE_FOOD:-4002}:4002"
    environment:
      - PORT=4002

  # Domain Microservice: Payments & Wallet
  service-wallet:
    build:
      context: .
      dockerfile: services/service-wallet/Dockerfile
    container_name: superapp-service-wallet
    ports:
      - "127.0.0.1:${PORT_SERVICE_WALLET:-4003}:4003"
    environment:
      - PORT=4003

  # Domain Microservice: Mini-App Registry & Catalog
  service-catalog:
    build:
      context: .
      dockerfile: services/service-catalog/Dockerfile
    container_name: superapp-service-catalog
    ports:
      - "127.0.0.1:${PORT_SERVICE_CATALOG:-4004}:4004"
    environment:
      - PORT=4004

  # Domain Microservice: User Profile & Preferences
  service-profile:
    build:
      context: .
      dockerfile: services/service-profile/Dockerfile
    container_name: superapp-service-profile
    ports:
      - "127.0.0.1:${PORT_SERVICE_PROFILE:-4005}:4005"
    environment:
      - PORT=4005

  # Identity & Access Management: Keycloak OIDC Auth Server
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: superapp-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:${PORT_KEYCLOAK:-8085}:8080"
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./services/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  # Frontend Shell: React 18 Host
  shell-react:
    build:
      context: .
      dockerfile: apps/shell-react/Dockerfile
    container_name: superapp-shell-react
    ports:
      - "${PORT_SHELL_REACT:-3000}:3000"
    environment:
      - VITE_GATEWAY_URL=http://localhost:4000
