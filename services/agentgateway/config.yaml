# ==============================================================================
# agentgateway.dev Configuration
# Unified Data Plane for LLMs, Multi-Agent Routing, and MCP Tool Federation
# ==============================================================================

version: "v1alpha1"

listeners:
  - name: edge-listener
    address: "0.0.0.0"
    port: 8080
    cors:
      allow_origins: ["*"]
      allow_methods: ["GET", "POST", "OPTIONS"]
      allow_headers: ["Content-Type", "Authorization", "X-Session-Id", "X-Client-Platform"]

# Model Gateway & LLM Inference Proxies
llm:
  providers:
    - name: openrouter
      type: openai_compatible
      base_url: "https://openrouter.ai/api/v1"
      api_key: "${OPENROUTER_API_KEY}"
      default_model: "anthropic/claude-3.5-sonnet"
      models:
        - "anthropic/claude-3.5-sonnet"
        - "google/gemini-2.0-flash-001"
        - "openai/gpt-4o"
      failover:
        - from: "anthropic/claude-3.5-sonnet"
          to: "google/gemini-2.0-flash-001"
          on_status: [429, 500, 503]
      budget:
        monthly_limit_usd: 100.00
        rate_limit_per_minute: 60

# Model Context Protocol (MCP) Tool Federation
mcp:
  servers:
    - name: service-mobility
      transport: sse
      url: "http://service-ride:4001/mcp"
      tools:
        - name: "mobility_getParkingZones"
          description: "Get smart parking zones (302A Downtown, 101B Business Bay) with tariffs and capacity"
        - name: "mobility_activateParking"
          description: "Activate RTA / Mawaqif public parking meter session for vehicle plate"
        - name: "mobility_getSalikBalance"
          description: "Query Salik / Darb toll account balance and low balance alerts"
        - name: "mobility_rechargeSalik"
          description: "Top-up Salik toll tag balance"
        - name: "mobility_findEVChargers"
          description: "Discover nearby DEWA EV Green Chargers and socket availability"
        - name: "ride_getOptions"
          description: "Get cab options, arrival ETAs, and fares"
        - name: "ride_bookCab"
          description: "Book an active ride"
    - name: service-utilities
      transport: sse
      url: "http://service-food:4002/mcp"
      tools:
        - name: "utilities_getConsumption"
          description: "Fetch live electricity (kWh) and water telemetry from DEWA smart premise meter"
        - name: "utilities_getBill"
          description: "Query monthly utility bill with housing municipality fee breakdown"
        - name: "utilities_payBill"
          description: "Settle DEWA / ADDC electricity and water bill"
        - name: "utilities_getEcoAdvice"
          description: "Fetch solar grid credits and peak hours reduction advice"
    - name: service-citizenpay
      transport: sse
      url: "http://service-wallet:4003/mcp"
      tools:
        - name: "citizenpay_getFines"
          description: "Check Dubai Police & Abu Dhabi Police traffic radar fines"
        - name: "citizenpay_payFines"
          description: "Settle traffic violations with early payment discount"
        - name: "citizenpay_unifiedCheckout"
          description: "Atomic multi-agency civic living settlement (DEWA + Police + Salik)"
        - name: "wallet_getBalance"
          description: "Fetch current citizen wallet balance and currency"
        - name: "wallet_authorizePayment"
          description: "Authorize payment transaction with user consent"
    - name: service-housing
      transport: sse
      url: "http://service-catalog:4004/mcp"
      tools:
        - name: "housing_getEjariContract"
          description: "Retrieve registered Ejari / Tawtheeq tenancy contract"
        - name: "housing_moveIn"
          description: "Execute Move-In Golden Path connecting DEWA and issuing residential parking"
    - name: service-profile
      transport: sse
      url: "http://service-profile:4005/mcp"
      tools:
        - name: "profile_getProfile"
          description: "Fetch authenticated UAE PASS citizen profile and Golden Visa tier"
        - name: "profile_getPreferences"
          description: "Fetch dietary, mobility, and UI preferences"
        - name: "profile_updatePreferences"
          description: "Update user preferences dynamically"
        - name: "profile_getPromptContext"
          description: "Fetch personalized system prompt instructions"

# Observability & Tracing
observability:
  telemetry:
    tracing:
      provider: opentelemetry
      sampler: always_on
