name: cityside-demo
x-node: &node
  image: node:24-alpine
  init: true
  stop_grace_period: 90s
  working_dir: /app
  volumes:
    - .:/app:ro
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  healthcheck:
    test: [CMD, node, -e, "fetch('http://127.0.0.1:'+process.env.PORT+'/ready',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 15s
x-identity: &identity
  OPS_API_KEY: ${OPS_API_KEY:-}
  OBSERVABILITY_LOGS: ${OBSERVABILITY_LOGS:-true}
  OPS_STUCK_MS: ${OPS_STUCK_MS:-120000}
  HTTP_MAX_CONCURRENT: ${HTTP_MAX_CONCURRENT:-64}
  HTTP_REQUESTS_PER_MINUTE: ${HTTP_REQUESTS_PER_MINUTE:-300}
  ELIGIBILITY_ENFORCEMENT: 'true'
  ELIGIBILITY_READER_SECRET: ${ELIGIBILITY_READER_SECRET:-demo-eligibility-reader-secret}
  KEYCLOAK_ISSUER: http://localhost:8085/realms/superapp
  KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/superapp/protocol/openid-connect/certs
  KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/superapp/protocol/openid-connect/token
  KEYCLOAK_INTROSPECTION_URL: http://keycloak:8080/realms/superapp/protocol/openid-connect/token/introspect
  KEYCLOAK_INTROSPECTION_CLIENT_ID: cityside-verifier
  KEYCLOAK_INTROSPECTION_CLIENT_SECRET: ${KEYCLOAK_VERIFIER_SECRET:-demo-verifier-secret}
  KEYCLOAK_AUDIENCE: agent-core
  NODE_ENV: development
  DELEGATION_ENABLED: 'true'
  DELEGATION_AUTHORITY_URL: http://delegation-broker:4010
x-providers: &providers
  PROVIDER_RTA_URL: http://provider-rta:4101
  PROVIDER_DEWA_URL: http://provider-dewa:4102
  PROVIDER_ETISALAT_URL: http://provider-etisalat:4103
  PROVIDER_DU_URL: http://provider-du:4104
  PROVIDER_POLICE_URL: http://provider-police:4105
  PROVIDER_DLD_URL: http://provider-dld:4106
  PROVIDER_PAYMENTS_URL: http://provider-payments:4107
services:
  voice:
    profiles: [local-ai]
    build:
      context: .
      dockerfile: services/voice/Dockerfile
    image: cityside-local-voice:0.1.0
    restart: unless-stopped
    volumes: [voice-models:/models]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
  conversation:
    profiles: [local-ai]
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:8c74db29f1a2bef3f0a331b52c4d6214601dfceed4bee0b94cc48b3b23ff257d
    command: ["-m", "/models/llm/qwen2.5-1.5b-instruct-q4_k_m.gguf", "--alias", "cityside-local", "--host", "0.0.0.0", "--port", "4201", "--ctx-size", "8192", "--threads", "2", "--parallel", "1", "--n-gpu-layers", "0", "--no-ui", "-lv", "1"]
    volumes: [voice-models:/models:ro]
    cpus: 2
    mem_limit: 3g
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, --fail, --silent, --show-error, --max-time, '2', 'http://127.0.0.1:4201/health']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 60s
  delegation-broker:
    <<: *node
    command: [node, --experimental-strip-types, services/delegation/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4010'
      DELEGATION_DB_PATH: /data/delegation/grants.sqlite
      DELEGATION_KEY_DIR: /data/delegation/keys
    ports: ['127.0.0.1:4010:4010']
    volumes:
      - .:/app:ro
      - delegation-data:/data/delegation
    depends_on: [keycloak]
  redis:
    image: redis:8.2-alpine
    command: [redis-server, --appendonly, 'yes', --appendfsync, everysec]
    ports: ['127.0.0.1:6379:6379']
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 2s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8085
      KC_HTTP_ENABLED: 'true'
    ports: ['127.0.0.1:8085:8080']
    volumes:
      - ./services/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
  provider-rta:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: rta
      PAYMENT_EVENT_RTA_KEY: ${PAYMENT_EVENT_RTA_KEY:-}
      PAYMENT_EVENT_RTA_KEY_ID: ${PAYMENT_EVENT_RTA_KEY_ID:-v1}
      PORT: '4101'
      PROVIDER_DB_PATH: /data/rta.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
      PROVIDER_RTA_CLAIM_SECRET: ${PROVIDER_RTA_CLAIM_SECRET:-demo-rta-settlement-secret}
    ports: ['127.0.0.1:4101:4101']
    volumes:
      - .:/app:ro
      - rta-data:/data
    depends_on: [keycloak]
  provider-dewa:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: dewa
      PAYMENT_EVENT_DEWA_KEY: ${PAYMENT_EVENT_DEWA_KEY:-}
      PAYMENT_EVENT_DEWA_KEY_ID: ${PAYMENT_EVENT_DEWA_KEY_ID:-v1}
      PORT: '4102'
      PROVIDER_DB_PATH: /data/dewa.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
      PROVIDER_DEWA_CLAIM_SECRET: ${PROVIDER_DEWA_CLAIM_SECRET:-demo-dewa-settlement-secret}
    ports: ['127.0.0.1:4102:4102']
    volumes:
      - .:/app:ro
      - dewa-data:/data
    depends_on: [keycloak]
  provider-etisalat:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: etisalat
      PAYMENT_EVENT_ETISALAT_KEY: ${PAYMENT_EVENT_ETISALAT_KEY:-}
      PAYMENT_EVENT_ETISALAT_KEY_ID: ${PAYMENT_EVENT_ETISALAT_KEY_ID:-v1}
      PORT: '4103'
      PROVIDER_DB_PATH: /data/etisalat.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
      PROVIDER_ETISALAT_CLAIM_SECRET: ${PROVIDER_ETISALAT_CLAIM_SECRET:-demo-etisalat-settlement-secret}
    ports: ['127.0.0.1:4103:4103']
    volumes:
      - .:/app:ro
      - etisalat-data:/data
    depends_on: [keycloak]
  provider-du:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: du
      PAYMENT_EVENT_DU_KEY: ${PAYMENT_EVENT_DU_KEY:-}
      PAYMENT_EVENT_DU_KEY_ID: ${PAYMENT_EVENT_DU_KEY_ID:-v1}
      PORT: '4104'
      PROVIDER_DB_PATH: /data/du.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
      PROVIDER_DU_CLAIM_SECRET: ${PROVIDER_DU_CLAIM_SECRET:-demo-du-settlement-secret}
    ports: ['127.0.0.1:4104:4104']
    volumes:
      - .:/app:ro
      - du-data:/data
    depends_on: [keycloak]
  provider-police:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: police
      PAYMENT_EVENT_POLICE_KEY: ${PAYMENT_EVENT_POLICE_KEY:-}
      PAYMENT_EVENT_POLICE_KEY_ID: ${PAYMENT_EVENT_POLICE_KEY_ID:-v1}
      PORT: '4105'
      PROVIDER_DB_PATH: /data/police.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
      PROVIDER_POLICE_CLAIM_SECRET: ${PROVIDER_POLICE_CLAIM_SECRET:-demo-police-settlement-secret}
    ports: ['127.0.0.1:4105:4105']
    volumes:
      - .:/app:ro
      - police-data:/data
    depends_on: [keycloak]
  provider-dld:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: dld
      PORT: '4106'
      PROVIDER_DB_PATH: /data/dld.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
    ports: ['127.0.0.1:4106:4106']
    volumes:
      - .:/app:ro
      - dld-data:/data
    depends_on: [keycloak]
  provider-payments:
    <<: *node
    command: [node, --experimental-strip-types, services/provider-simulator/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PROVIDER_ID: payments
      PAYMENT_EVENT_RTA_KEY: ${PAYMENT_EVENT_RTA_KEY:-}
      PAYMENT_EVENT_RTA_KEY_ID: ${PAYMENT_EVENT_RTA_KEY_ID:-v1}
      PAYMENT_EVENT_RTA_PREVIOUS_KEY: ${PAYMENT_EVENT_RTA_PREVIOUS_KEY:-}
      PAYMENT_EVENT_RTA_PREVIOUS_KEY_ID: ${PAYMENT_EVENT_RTA_PREVIOUS_KEY_ID:-previous}
      PAYMENT_EVENT_DEWA_KEY: ${PAYMENT_EVENT_DEWA_KEY:-}
      PAYMENT_EVENT_DEWA_KEY_ID: ${PAYMENT_EVENT_DEWA_KEY_ID:-v1}
      PAYMENT_EVENT_DEWA_PREVIOUS_KEY: ${PAYMENT_EVENT_DEWA_PREVIOUS_KEY:-}
      PAYMENT_EVENT_DEWA_PREVIOUS_KEY_ID: ${PAYMENT_EVENT_DEWA_PREVIOUS_KEY_ID:-previous}
      PAYMENT_EVENT_ETISALAT_KEY: ${PAYMENT_EVENT_ETISALAT_KEY:-}
      PAYMENT_EVENT_ETISALAT_KEY_ID: ${PAYMENT_EVENT_ETISALAT_KEY_ID:-v1}
      PAYMENT_EVENT_ETISALAT_PREVIOUS_KEY: ${PAYMENT_EVENT_ETISALAT_PREVIOUS_KEY:-}
      PAYMENT_EVENT_ETISALAT_PREVIOUS_KEY_ID: ${PAYMENT_EVENT_ETISALAT_PREVIOUS_KEY_ID:-previous}
      PAYMENT_EVENT_DU_KEY: ${PAYMENT_EVENT_DU_KEY:-}
      PAYMENT_EVENT_DU_KEY_ID: ${PAYMENT_EVENT_DU_KEY_ID:-v1}
      PAYMENT_EVENT_DU_PREVIOUS_KEY: ${PAYMENT_EVENT_DU_PREVIOUS_KEY:-}
      PAYMENT_EVENT_DU_PREVIOUS_KEY_ID: ${PAYMENT_EVENT_DU_PREVIOUS_KEY_ID:-previous}
      PAYMENT_EVENT_POLICE_KEY: ${PAYMENT_EVENT_POLICE_KEY:-}
      PAYMENT_EVENT_POLICE_KEY_ID: ${PAYMENT_EVENT_POLICE_KEY_ID:-v1}
      PAYMENT_EVENT_POLICE_PREVIOUS_KEY: ${PAYMENT_EVENT_POLICE_PREVIOUS_KEY:-}
      PAYMENT_EVENT_POLICE_PREVIOUS_KEY_ID: ${PAYMENT_EVENT_POLICE_PREVIOUS_KEY_ID:-previous}
      PAYMENT_EVENT_PAYMENTS_KEY: ${PAYMENT_EVENT_PAYMENTS_KEY:-}
      PAYMENT_EVENT_PAYMENTS_KEY_ID: ${PAYMENT_EVENT_PAYMENTS_KEY_ID:-v1}
      PAYMENT_EVENT_PAYMENTS_PREVIOUS_KEY: ${PAYMENT_EVENT_PAYMENTS_PREVIOUS_KEY:-}
      PAYMENT_EVENT_PAYMENTS_PREVIOUS_KEY_ID: ${PAYMENT_EVENT_PAYMENTS_PREVIOUS_KEY_ID:-previous}
      PORT: '4107'
      PROVIDER_DB_PATH: /data/payments.sqlite
      PROVIDER_SETTLEMENT_SECRET: demo-settlements-secret
    ports: ['127.0.0.1:4107:4107']
    volumes:
      - .:/app:ro
      - payments-data:/data
    depends_on: [keycloak]
  service-ride:
    <<: *node
    command: [node, --experimental-strip-types, services/service-ride/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4001'
      PROVIDER_INTEGRATION: 'true'
      SERVICE_CLIENT_SECRET: demo-ride-secret
      APP_DATA_DIR: /data
    ports: ['127.0.0.1:4001:4001']
    volumes:
      - .:/app:ro
      - app-ride-data:/data
    depends_on: [keycloak]
  service-food:
    <<: *node
    command: [node, --experimental-strip-types, services/service-food/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4002'
      PROVIDER_INTEGRATION: 'true'
      SERVICE_CLIENT_SECRET: demo-food-secret
      APP_DATA_DIR: /data
    ports: ['127.0.0.1:4002:4002']
    volumes:
      - .:/app:ro
      - app-food-data:/data
    depends_on: [keycloak]
  service-wallet:
    <<: *node
    command: [node, --experimental-strip-types, services/service-wallet/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4003'
      PROVIDER_INTEGRATION: 'true'
      SERVICE_CLIENT_SECRET: demo-wallet-secret
      APP_DATA_DIR: /data
    ports: ['127.0.0.1:4003:4003']
    volumes:
      - .:/app:ro
      - app-wallet-data:/data
    depends_on: [keycloak]
  service-catalog:
    <<: *node
    command: [node, --experimental-strip-types, services/service-catalog/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4004'
      PROVIDER_INTEGRATION: 'true'
      SERVICE_CLIENT_SECRET: demo-catalog-secret
      APP_DATA_DIR: /data
    ports: ['127.0.0.1:4004:4004']
    volumes:
      - .:/app:ro
      - app-catalog-data:/data
    depends_on: [keycloak]
  service-profile:
    <<: *node
    command: [node, --experimental-strip-types, services/service-profile/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4005'
      PROVIDER_INTEGRATION: 'true'
      SERVICE_CLIENT_SECRET: demo-profile-secret
      APP_DATA_DIR: /data
    ports: ['127.0.0.1:4005:4005']
    volumes:
      - .:/app:ro
      - app-profile-data:/data
    depends_on: [keycloak]
  service-telecom:
    <<: *node
    command: [node, --experimental-strip-types, services/service-telecom/src/index.ts]
    environment:
      <<: [*identity, *providers]
      PORT: '4006'
      PROVIDER_INTEGRATION: 'true'
      SERVICE_CLIENT_SECRET: demo-telecom-secret
      APP_DATA_DIR: /data
    ports: ['127.0.0.1:4006:4006']
    volumes:
      - .:/app:ro
      - app-telecom-data:/data
    depends_on: [keycloak]
  agent-core:
    <<: *node
    command: [node, --experimental-strip-types, services/agent-core/src/index.ts]
    environment:
      <<: *identity
      PORT: '4000'
      DEMO_AUTH: 'false'
      PROVIDER_INTEGRATION: 'true'
      DOMAIN_TRANSPORT: http
      SESSION_STORE: redis
      REDIS_URL: redis://redis:6379
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      KEYCLOAK_PUBLIC_ISSUER: http://localhost:8085/realms/superapp
      VOICE_SERVICE_URL: http://voice:4200
      ENABLE_LOCAL_LLM: ${ENABLE_LOCAL_LLM:-true}
      CONVERSATION_PROVIDER: ${CONVERSATION_PROVIDER:-local}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-}
      LITELLM_URL: ${LITELLM_URL:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      LITELLM_MODEL: ${LITELLM_MODEL:-glm-5.3}
      LITELLM_MAX_TOKENS: ${LITELLM_MAX_TOKENS:-512}
      CONVERSATION_SERVICE_URL: http://conversation:4201
      SERVICE_RIDE_URL: http://service-ride:4001
      SERVICE_FOOD_URL: http://service-food:4002
      SERVICE_WALLET_URL: http://service-wallet:4003
      SERVICE_CATALOG_URL: http://service-catalog:4004
      SERVICE_PROFILE_URL: http://service-profile:4005
      SERVICE_TELECOM_URL: http://service-telecom:4006
      PROVIDER_RTA_URL: http://provider-rta:4101
      PROVIDER_DEWA_URL: http://provider-dewa:4102
      PROVIDER_ETISALAT_URL: http://provider-etisalat:4103
      PROVIDER_DU_URL: http://provider-du:4104
      PROVIDER_POLICE_URL: http://provider-police:4105
      PROVIDER_DLD_URL: http://provider-dld:4106
      PROVIDER_PAYMENTS_URL: http://provider-payments:4107
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
volumes:
  voice-models: {}
  delegation-data: {}
  redis-data: {}
  keycloak-data: {}
  rta-data: {}
  dewa-data: {}
  etisalat-data: {}
  du-data: {}
  police-data: {}
  dld-data: {}
  payments-data: {}
  app-ride-data: {}
  app-food-data: {}
  app-wallet-data: {}
  app-catalog-data: {}
  app-profile-data: {}
  app-telecom-data: {}
